spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/vamospet_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=vamospetnotis@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=gemini-3.7-flash

seguridad.bcrypt.activo=false

app.frontend.url=http://127.0.0.1:5500/frontend/index.html
# Activación final de seguridad BCrypt