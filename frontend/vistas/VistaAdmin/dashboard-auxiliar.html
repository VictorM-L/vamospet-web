<div class="fade-in admin-layout">

    <aside class="admin-sidebar">
        <div style="color: white; font-size: 18px; font-weight: 800; padding: 10px 18px 20px 18px; border-bottom: 1px solid #374151; margin-bottom: 10px;">
            <i class="fa-solid fa-user-nurse" style="color: var(--primary-green);"></i> Panel Auxiliar
        </div>

        <button class="sidebar-item active" onclick="cargarVista('VistaAdmin/dashboard-auxiliar')"><i class="fa-solid fa-chart-pie"></i> Dashboard</button>
        <button class="sidebar-item" onclick="cargarVista('VistaAdmin/venta-mostrador')"><i class="fa-solid fa-cash-register"></i> Venta en Mostrador</button>
        <button class="sidebar-item" onclick="cargarVista('VistaAdmin/citas')"><i class="fa-solid fa-calendar-check"></i> Ver Citas</button>
        <button class="sidebar-item" onclick="cargarVista('VistaAdmin/examenes')"><i class="fa-solid fa-flask-vial"></i> Exámenes y Cirugías</button>
        <button class="sidebar-item" onclick="cargarVista('VistaAdmin/emergencias')"><i class="fa-solid fa-truck-medical"></i> Emergencias</button>
        <button class="sidebar-item" onclick="cargarVista('VistaAdmin/comprobantes')"><i class="fa-solid fa-receipt"></i> Comprobantes</button>
    </aside>

    <main class="admin-content">

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="font-size: 24px; font-weight: 800; color: var(--dark-text);">Panel de Mostrador</h2>
            <button class="btn-primary" onclick="cargarVista('VistaAdmin/venta-mostrador')"><i class="fa-solid fa-cash-register"></i> Nueva Venta</button>
        </div>

        <div class="metrics-grid" id="aux-metrics">
            <div class="metric-card" style="background: var(--primary-green); color: white; border: none;">
                <div class="metric-icon" style="background: rgba(255,255,255,0.2); color: white;"><i class="fa-solid fa-sack-dollar"></i></div>
                <div>
                    <h4 style="font-size: 13px; font-weight: 600; margin-bottom: 5px; opacity: 0.9;">Caja de Hoy</h4>
                    <h2 style="font-size: 28px; font-weight: 800;" id="aux-caja-hoy">S/ 0.00</h2>
                </div>
            </div>
        </div>
            </div>
        </div>


        <div class="admin-table-container">
            <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 10px;">Pedidos Pendientes de Preparar</h3>
            <div id="aux-pedidos-pendientes"></div>
        </div>

        <div class="admin-table-container">
            <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 10px;">Pedidos Listos para Recoger</h3>
            <div id="aux-pedidos-listos"></div>
        </div>

    </main>
</div>

<script>
(function () {
    async function init() {
        try {
            const [resPagos, resPedidos, resUsuarios] = await Promise.all([
                fetch(`${API_BASE}/pagos`),
                fetch(`${API_BASE}/pedidos`),
                fetchUsuarios()
            ]);

            const pagos = resPagos.ok ? await resPagos.json() : [];
            const pedidos = resPedidos.ok ? await resPedidos.json() : [];
            const usuarios = resUsuarios.ok ? await resUsuarios.json() : [];

            const hoy = new Date().toDateString();
            const cajaHoy = pagos
                .filter(p => p.fecha && new Date(p.fecha).toDateString() === hoy)
                .reduce((sum, p) => sum + Number(p.monto || 0), 0);
            document.getElementById('aux-caja-hoy').innerText = `S/ ${cajaHoy.toFixed(2)}`;

            const pendientes = pedidos.filter(p => p.estado === 'Pendiente');
            const contPendientes = document.getElementById('aux-pedidos-pendientes');
            if (pendientes.length === 0) {
                contPendientes.innerHTML = `<p style="color: var(--text-muted); font-size: 13px;">No hay pedidos pendientes por preparar.</p>`;
            } else {
                contPendientes.innerHTML = pendientes.map(p => {
                    const cliente = usuarios.find(u => u.id === p.usuario_id);
                    return `
                        <div style="display:flex; justify-content:space-between; align-items:center; padding: 10px 0; border-bottom: 1px solid #F3F4F6;">
                            <div>
                                <strong style="font-size: 13px;">Pedido #${p.id}</strong>
                                <span style="font-size: 12px; color: var(--text-muted);"> — ${cliente ? cliente.nombre : 'N/D'} — S/ ${Number(p.total || 0).toFixed(2)}</span>
                            </div>
                            <button class="btn-primary" style="padding: 6px 14px; font-size: 12px;" onclick="marcarPedidoListo(${p.id})"><i class="fa-solid fa-check"></i> Marcar Listo</button>
                        </div>
                    `;
                }).join('');
            }

            const listos = pedidos.filter(p => p.estado === 'Listo para recoger');
            const contPedidos = document.getElementById('aux-pedidos-listos');
            if (listos.length === 0) {
                contPedidos.innerHTML = `<p style="color: var(--text-muted); font-size: 13px;">No hay pedidos esperando ser recogidos.</p>`;
            } else {
                contPedidos.innerHTML = listos.map(p => {
                    const cliente = usuarios.find(u => u.id === p.usuario_id);
                    return `
                        <div style="display:flex; justify-content:space-between; align-items:center; padding: 10px 0; border-bottom: 1px solid #F3F4F6;">
                            <div>
                                <strong style="font-size: 13px;">Pedido #${p.id}</strong>
                                <span style="font-size: 12px; color: var(--text-muted);"> — ${cliente ? cliente.nombre : 'N/D'} — S/ ${Number(p.total || 0).toFixed(2)}</span>
                            </div>
                            <button class="btn-outline" style="padding: 6px 14px; font-size: 12px;" onclick="marcarPedidoEntregado(${p.id})"><i class="fa-solid fa-box-check"></i> Entregado</button>
                        </div>
                    `;
                }).join('');
            }
        } catch (error) {
            console.error('Error cargando dashboard del auxiliar:', error);
        }
    }

    window.marcarPedidoListo = async function (pedidoId) {
        try {
            const res = await fetch(`${API_BASE}/pedidos/${pedidoId}/estado`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ estado: 'Listo para recoger' })
            });
            if (!res.ok) throw new Error();
            await init();
        } catch (error) {
            alert('No se pudo actualizar el pedido.');
        }
    };

    window.marcarPedidoEntregado = async function (pedidoId) {
        try {
            const res = await fetch(`${API_BASE}/pedidos/${pedidoId}/estado`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ estado: 'Entregado' })
            });
            if (!res.ok) throw new Error();
            await init();
        } catch (error) {
            alert('No se pudo actualizar el pedido.');
        }
    };

    init();
})();
</script>
