<div class="fade-in admin-layout">
    <aside class="admin-sidebar">
        <div style="color: white; font-size: 18px; font-weight: 800; padding: 10px 18px 20px 18px; border-bottom: 1px solid #374151; margin-bottom: 10px;">
            <i class="fa-solid fa-shield-halved" style="color: var(--primary-green);"></i> Admin Panel
        </div>

        <button class="sidebar-item" onclick="cargarVista('VistaAdmin/dashboard-admin')"><i class="fa-solid fa-chart-pie"></i> Dashboard</button>
        <button class="sidebar-item active" onclick="cargarVista('VistaAdmin/citas')"><i class="fa-solid fa-calendar-check"></i> Gestión de Citas</button>
        <button class="sidebar-item" onclick="cargarVista('VistaAdmin/examenes')"><i class="fa-solid fa-flask-vial"></i> Exámenes y Cirugías</button>
        <button class="sidebar-item" onclick="cargarVista('VistaAdmin/emergencias')"><i class="fa-solid fa-truck-medical"></i> Emergencias</button>
        <button class="sidebar-item" onclick="cargarVista('VistaAdmin/clientes')"><i class="fa-solid fa-users"></i> Clientes y Mascotas</button>
        <button class="sidebar-item" onclick="cargarVista('VistaAdmin/servicios')"><i class="fa-solid fa-briefcase-medical"></i> Servicios</button>
        <button class="sidebar-item" onclick="cargarVista('VistaAdmin/inventario')"><i class="fa-solid fa-box-open"></i> Inventario Tienda</button>
        <button class="sidebar-item" onclick="cargarVista('VistaAdmin/proveedores')"><i class="fa-solid fa-truck-field"></i> Proveedores</button>
        <button class="sidebar-item" onclick="cargarVista('VistaAdmin/compras')"><i class="fa-solid fa-cart-flatbed"></i> Compras</button>
        <button class="sidebar-item" onclick="cargarVista('VistaAdmin/devoluciones')"><i class="fa-solid fa-rotate-left"></i> Devoluciones</button>
        <button class="sidebar-item" onclick="cargarVista('VistaAdmin/reservas')"><i class="fa-solid fa-hotel"></i> Reservas y viajes</button>
        <button class="sidebar-item" onclick="cargarVista('VistaAdmin/comprobantes')"><i class="fa-solid fa-receipt"></i> Comprobantes</button>
        <button class="sidebar-item" onclick="cargarVista('VistaAdmin/finanzas')"><i class="fa-solid fa-file-invoice-dollar"></i> Finanzas</button>
        <button class="sidebar-item" onclick="cargarVista('VistaAdmin/reportes')"><i class="fa-solid fa-chart-column"></i> Reportes</button>
        <button class="sidebar-item" onclick="cargarVista('VistaAdmin/horarios')"><i class="fa-solid fa-clock"></i> Horarios Veterinarios</button>
        <button class="sidebar-item" onclick="cargarVista('VistaAdmin/personal')"><i class="fa-solid fa-user-nurse"></i> Personal</button>
        <button class="sidebar-item" onclick="cargarVista('VistaAdmin/configuracion')"><i class="fa-solid fa-gear"></i> Configuración</button>
    </aside>

    <main class="admin-content">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
            <h2 style="font-size: 24px; font-weight: 800; color: var(--dark-text);">Gestión de Citas</h2>
        </div>

        <div style="background: white; padding: 20px; border-radius: 15px; box-shadow: var(--shadow-soft); border: 1px solid #E4E7EC; display: flex; gap: 15px; flex-wrap: wrap;">
            <input type="date" id="filtro-fecha-citas" style="padding: 10px 15px; border-radius: 8px; border: 1px solid #E4E7EC; font-family: 'Poppins'; outline: none; color: var(--text-muted);">
            <select id="filtro-estado-citas" style="padding: 10px 15px; border-radius: 8px; border: 1px solid #E4E7EC; font-family: 'Poppins'; outline: none; color: var(--text-muted); flex: 1;">
                <option value="">Cualquier Estado</option>
                <option value="Pendiente">Pendientes</option>
                <option value="Confirmada">Confirmadas</option>
                <option value="En curso">En curso</option>
                <option value="Atendida">Atendidas</option>
                <option value="No asistió">No asistió</option>
                <option value="Cancelada">Canceladas</option>
                <option value="Rechazada">Rechazadas</option>
                <option value="Por reasignar">Por reasignar</option>
                <option value="__solicitud">Con solicitud de cancelación</option>
            </select>
            <button class="btn-outline" style="padding: 10px 20px;" onclick="filtrarCitasAdmin()"><i class="fa-solid fa-filter"></i> Filtrar</button>
            <button class="btn-outline" style="padding: 10px 20px;" onclick="document.getElementById('filtro-fecha-citas').value=''; document.getElementById('filtro-estado-citas').value=''; filtrarCitasAdmin();">Limpiar</button>
        </div>

        <div id="cola-auxiliar" class="cola-auxiliar" data-roles="4"></div>

        <div class="admin-table-container">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Fecha y Hora</th>
                        <th>Mascota / Cliente</th>
                        <th>Servicio</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="citas-admin-body">
                    <tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding: 20px;"><i class="fa-solid fa-spinner fa-spin"></i> Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<div class="modal-overlay" id="modal-reasignar-cita" style="display:none;">
    <div class="modal-box">
        <h3><i class="fa-solid fa-shuffle" style="color: var(--primary-green);"></i> Reasignar cita <span id="reasignar-cita-num"></span></h3>
        <p id="reasignar-cita-detalle" style="font-size: 13px; color: var(--text-muted); margin: 8px 0 15px; line-height: 1.5;"></p>
        <div class="input-group">
            <label for="reasignar-vet">Veterinario libre a esa hora</label>
            <select id="reasignar-vet"></select>
        </div>
        <p id="reasignar-sin-vets" style="display:none; font-size: 13px; color: #B42318; margin-bottom: 15px;">No hay otro veterinario libre a esa hora con esa especialidad. Puedes cancelar la cita y avisar al cliente.</p>
        <div style="display: flex; gap: 10px;">
            <button type="button" class="btn-outline" style="flex: 1; padding: 12px;" onclick="document.getElementById('modal-reasignar-cita').style.display='none'">Cerrar</button>
            <button type="button" class="btn-outline" style="flex: 1; padding: 12px; color: #B42318; border-color: #FECDCA;" onclick="cancelarDesdeReasignar()">Cancelar cita</button>
            <button type="button" class="btn-primary" id="reasignar-confirmar" style="flex: 1; padding: 12px; justify-content: center;" onclick="confirmarReasignacion()">Reasignar</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal-costos-cita" style="display:none;">
    <div class="modal-box">
        <h3><i class="fa-solid fa-coins" style="color:var(--primary-green);"></i> Costos de la cita <span id="costos-cita-num"></span></h3>
        <div id="costos-cita-cuerpo"></div>
        <form id="form-costo-extra" style="display:none; margin-top:12px;">
            <div class="input-group"><label>Concepto</label><input type="text" id="costo-concepto" maxlength="200" placeholder="Ej. Radiografía, medicamento aplicado" required></div>
            <div class="input-group"><label>Monto (S/)</label><input type="number" id="costo-monto" min="0.01" step="0.01" required></div>
            <button type="submit" class="btn-primary" style="width:100%; padding:12px;"><i class="fa-solid fa-plus"></i> Agregar costo extra</button>
        </form>
        <div id="cobro-cita-bloque" style="display:none; margin-top:14px; padding-top:14px; border-top:1px solid #E4E7EC;">
            <div style="display:flex; gap:10px; align-items:flex-end;">
                                <button type="button" class="btn-primary" style="padding:12px 18px;" onclick="cobrarCitaActual()"><i class="fa-solid fa-cash-register"></i> Cobrar <span id="cobro-cita-monto"></span></button>
            </div>
        </div>
        <button class="btn-outline" style="width:100%; padding:12px; margin-top:12px;" onclick="document.getElementById('modal-costos-cita').style.display='none'">Cerrar</button>
    </div>
</div>

<div class="modal-overlay" id="modal-atender" style="display:none;">
    <div class="modal-box">
        <h3><i class="fa-solid fa-notes-medical" style="color: var(--primary-green);"></i> Registrar atención <span id="atender-num"></span></h3>
        <p id="atender-resumen" style="font-size:13px; color:var(--text-muted); margin-bottom:10px;"></p>
        <form id="form-atender">
            <div class="input-group"><label>Diagnóstico *</label><textarea id="atender-diagnostico" rows="3" maxlength="2000" required placeholder="Ej. Otitis externa leve en oído derecho"></textarea></div>
            <div class="input-group"><label>Tratamiento / indicaciones</label><textarea id="atender-tratamiento" rows="3" maxlength="2000" placeholder="Ej. Limpieza ótica cada 12 h por 7 días"></textarea></div>
            <label style="display:flex; align-items:center; gap:8px; font-size:13px; margin:8px 0;"><input type="checkbox" id="atender-con-vacuna"> Se aplicó una vacuna</label>
            <div id="atender-vacuna-bloque" style="display:none;">
                <div class="input-group"><label>Vacuna aplicada</label><input type="text" id="atender-vacuna-nombre" maxlength="100" placeholder="Ej. Quíntuple"></div>
                <div class="input-group"><label>Próxima dosis (opcional)</label><input type="date" id="atender-vacuna-proxima"></div>
            </div>
            <button type="submit" class="btn-primary" style="width:100%; padding:12px; margin-top:8px;"><i class="fa-solid fa-check"></i> Guardar y marcar como atendida</button>
        </form>
        <button class="btn-outline" style="width:100%; padding:12px; margin-top:10px;" onclick="document.getElementById('modal-atender').style.display='none'">Cancelar</button>
    </div>
</div>

<script>
(function () {
    let __citasTodas = [], __mascotasTodas = [], __usuariosTodos = [], __serviciosTodos = [];

    function pintarCitasAdmin(lista) {
        const cuerpo = document.getElementById('citas-admin-body');
        if (lista.length === 0) {
            cuerpo.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding: 20px;">No hay citas que coincidan con el filtro.</td></tr>`;
            return;
        }

        cuerpo.innerHTML = lista.map(c => {
            const mascota = __mascotasTodas.find(m => m.id === c.mascota_id);
            const cliente = mascota ? __usuariosTodos.find(u => u.id === mascota.usuario_id) : null;
            const servicio = __serviciosTodos.find(s => s.id === c.servicio_id);
            const fecha = c.fecha_hora ? new Date(c.fecha_hora).toLocaleString('es-PE', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
            const claseEstado = claseEstadoCita(c.estado);
            const esCirugia = !!servicio && String(servicio.nombre || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().includes('cirugia');

            const rol = __yo().rol_id;
            const esVet = rol === 3, esAux = rol === 4;
            const miCita = esVet && c.veterinario_id === __yo().id;
            const boton = (color, icono, titulo, accion) => `<button style="background:none; border:none; color:${color}; cursor:pointer; font-size:16px; margin-right: 10px;" onclick="${accion}" title="${titulo}" aria-label="${titulo}"><i class="fa-solid ${icono}"></i></button>`;
            let acciones = '';
            if (miCita && c.estado === 'Pendiente') {
                acciones += boton('var(--primary-green)', 'fa-check-double', 'Confirmar cita', `confirmarCitaVet(${c.id})`);
                acciones += boton('#D97706', 'fa-hand', 'No puedo atender', `noPuedoAtender(${c.id})`);
            }
            if (miCita && c.estado === 'Confirmada') {
                if (servicio && /virtual/i.test(servicio.nombre)) acciones += boton('var(--primary-green)', 'fa-video', c.enlace_videollamada ? 'Cambiar enlace de videollamada' : 'Enviar enlace de videollamada', `enviarEnlaceVideollamada(${c.id}, '${__escC(c.enlace_videollamada || '')}')`);
                if (esCirugia) acciones += boton('var(--primary-green)', 'fa-table-columns', 'Es una cirugía: se atiende desde el tablero de cirugías', `cargarVista('VistaAdmin/examenes')`);
                else acciones += boton('var(--primary-green)', 'fa-check', 'Registrar atención (marcar como atendida)', `abrirAtender(${c.id})`);
                acciones += boton('#D97706', 'fa-hand', 'No puedo atender', `noPuedoAtender(${c.id})`);
            }
            if (miCita && c.estado === 'En curso') {
                acciones += boton('var(--primary-green)', 'fa-table-columns', 'Cirugía en curso: continúa en el tablero de cirugías', `cargarVista('VistaAdmin/examenes')`);
            }
            if (esAux) {
                if (c.estado === 'Pendiente') acciones += boton('#6B7280', 'fa-ban', 'Rechazar cita', `rechazarCita(${c.id})`);
                if (c.estado === 'Confirmada') acciones += boton('#D97706', 'fa-user-clock', 'Marcar como No asistió', `cambiarEstadoCitaAdmin(${c.id}, 'No asistió')`);
                if (c.estado === 'Por reasignar') acciones += boton('var(--primary-green)', 'fa-shuffle', 'Reasignar a otro veterinario', `abrirReasignar(${c.id})`);
                if (c.cancelacion_solicitada) {
                    acciones += boton('#B42318', 'fa-calendar-xmark', 'Aprobar solicitud de cancelación', `resolverSolicitudCancelacion(${c.id}, true)`);
                    acciones += boton('var(--primary-green)', 'fa-calendar-check', 'Mantener la cita', `resolverSolicitudCancelacion(${c.id}, false)`);
                } else if (['Pendiente', 'Confirmada', 'Por reasignar'].includes(c.estado)) {
                    acciones += boton('#EF4444', 'fa-xmark', 'Cancelar cita', `cambiarEstadoCitaAdmin(${c.id}, 'Cancelada')`);
                }
            }
            if (!acciones) acciones = `<span style="color: var(--text-muted); font-size: 12px;">Sin acciones para tu rol</span>`;
            const notas = (c.motivo_estado && ['Por reasignar', 'Rechazada', 'Cancelada'].includes(c.estado) ? `<span class="motivo-cita">${__escC(c.motivo_estado)}</span>` : '')
                + (c.cancelacion_solicitada ? `<span class="etiqueta-solicitud"><i class="fa-solid fa-bell"></i> Pide cancelar: ${__escC(c.motivo_solicitud || '')}</span>` : '');
            const veterinario = __usuariosTodos.find(u => u.id === c.veterinario_id);

            return `
                <tr>
                    <td>${fecha}</td>
                    <td><strong>${mascota ? __escC(mascota.nombre) : 'N/D'}</strong><br><span style="color: var(--text-muted); font-size: 12px;">${cliente ? __escC(cliente.nombre) : 'N/D'}</span></td>
                    <td>${servicio ? __escC(servicio.nombre) : 'N/D'}</td>
                    <td><span class="status-badge ${claseEstado}">${__escC(c.estado)}</span>${veterinario ? `<span class="motivo-cita">${__escC(veterinario.nombre)}</span>` : ''}${notas}</td>
                    <td>${acciones}<button style="background:none; border:none; color:var(--primary-green); cursor:pointer; font-size:16px; margin-left:10px;" onclick="abrirCostosCita(${c.id})" title="Costos de la cita"><i class="fa-solid fa-coins"></i></button></td>
                </tr>
            `;
        }).join('');
    }

    let __citaAtenderId = null;
    window.abrirAtender = function (id) {
        const c = __citasTodas.find(x => x.id === id);
        const m = c ? __mascotasTodas.find(x => x.id === c.mascota_id) : null;
        __citaAtenderId = id;
        document.getElementById('form-atender').reset();
        document.getElementById('atender-vacuna-bloque').style.display = 'none';
        document.getElementById('atender-num').innerText = '#' + id;
        document.getElementById('atender-resumen').innerText = m ? 'Mascota: ' + m.nombre + ' (' + (m.especie || '') + ')' : '';
        document.getElementById('modal-atender').style.display = 'flex';
    };
    document.getElementById('atender-con-vacuna').addEventListener('change', e => {
        document.getElementById('atender-vacuna-bloque').style.display = e.target.checked ? 'block' : 'none';
    });
    document.getElementById('form-atender').addEventListener('submit', async (e) => {
        e.preventDefault();
        const conVacuna = document.getElementById('atender-con-vacuna').checked;
        const cuerpo = {
            usuario_id: __yo().id,
            diagnostico: document.getElementById('atender-diagnostico').value,
            tratamiento: document.getElementById('atender-tratamiento').value
        };
        if (conVacuna) {
            cuerpo.vacuna_nombre = document.getElementById('atender-vacuna-nombre').value;
            cuerpo.vacuna_proxima_dosis = document.getElementById('atender-vacuna-proxima').value || null;
        }
        const res = await fetch(`${API_BASE}/citas/${__citaAtenderId}/atender`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { alert(data.error || 'No se pudo registrar la atención.'); return; }
        document.getElementById('modal-atender').style.display = 'none';
        __citasTodas = __citasTodas.map(c => c.id === data.id ? data : c);
        filtrarCitasAdmin();
        alert('Atención registrada. Ya aparece en el historial médico de la mascota.');
    });

    let __citaCostosId = null;
    const __yo = () => JSON.parse(localStorage.getItem('usuarioLogueado') || '{}');
    const __escC = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    async function pintarCostosCita() {
        const res = await fetch(`${API_BASE}/citas/${__citaCostosId}/costos-adicionales`);
        const d = res.ok ? await res.json() : null;
        if (!d) { document.getElementById('costos-cita-cuerpo').innerHTML = '<p>No se pudo cargar.</p>'; return; }
        const citaActual = __citasTodas.find(c => c.id === __citaCostosId);
        const puede = d.editable && __yo().rol_id === 3 && citaActual && citaActual.veterinario_id === __yo().id;
        const conTotales = d.total !== undefined;
        document.getElementById('costos-cita-cuerpo').innerHTML = `
            <table class="admin-table"><tbody>
                ${conTotales ? `<tr><td>Costo base del servicio</td><td style="text-align:right;">S/ ${Number(d.base).toFixed(2)}</td><td></td></tr>` : ''}
                ${d.extras.length === 0 && !conTotales ? '<tr><td colspan="3" style="color: var(--text-muted);">Aún no hay costos adicionales.</td></tr>' : ''}
                ${d.extras.map(x => `<tr><td>${__escC(x.concepto)}</td><td style="text-align:right;">S/ ${Number(x.monto).toFixed(2)}</td>
                    <td>${puede ? `<button style="background:none; border:none; color:#EF4444; cursor:pointer;" onclick="quitarCostoExtra(${x.id})" aria-label="Quitar costo"><i class="fa-solid fa-xmark"></i></button>` : ''}</td></tr>`).join('')}
                ${conTotales ? `<tr><td><strong>Total</strong></td><td style="text-align:right;"><strong>S/ ${Number(d.total).toFixed(2)}</strong></td><td></td></tr>` : ''}
            </tbody></table>
            ${!conTotales ? '<p style="font-size:12px; color:var(--text-muted); margin-top:8px;">Registra aquí lo que usaste en la atención. El total y el cobro los ve el Auxiliar.</p>' : ''}
            ${!d.editable ? '<p style="font-size:12px; color:var(--text-muted); margin-top:8px;">Esta cita ya no admite cambios de costo (cobrada, cancelada o No asistió).</p>' : ''}`;
        document.getElementById('form-costo-extra').style.display = puede ? 'block' : 'none';

        const cita = __citasTodas.find(c => c.id === __citaCostosId);
        const puedeCobrar = d.editable && cita && cita.estado === 'Atendida' && __yo().rol_id === 4;
        document.getElementById('cobro-cita-bloque').style.display = puedeCobrar ? 'block' : 'none';
        document.getElementById('cobro-cita-monto').innerText = 'S/ ' + Number(d.total).toFixed(2);
    }

    window.cobrarCitaActual = function () {
        const id = __citaCostosId;
        const monto = parseFloat(document.getElementById('cobro-cita-monto').innerText.replace('S/', ''));
        abrirModalPago({
            titulo: 'Cobrar cita #' + id,
            monto,
            enviar: (datos) => enviarJson(`${API_BASE}/citas/${id}/cobrar`, 'POST', { usuario_id: __yo().id, ...datos }),
            alExito: (data) => {
                alert(data.pago && data.pago.estado === 'Por_confirmar'
                    ? 'Pago Yape registrado. Falta confirmarlo en Finanzas.'
                    : 'Cita cobrada. Se emitió el comprobante ' + data.comprobante.numero + '.');
                if (data.comprobante) abrirArchivoApi(`${API_BASE}/comprobantes/${data.comprobante.id}/pdf?usuarioId=${__yo().id}`);
                pintarCostosCita();
            }
        });
    };

    window.enviarEnlaceVideollamada = async function (id, actual) {
        const enlace = prompt('Pega el enlace de la videollamada (https://...)', actual || '');
        if (enlace === null) return;
        try {
            const data = await enviarJson(`${API_BASE}/citas/${id}/videollamada`, 'PATCH', { usuario_id: __yo().id, enlace: enlace.trim() });
            __citasTodas = __citasTodas.map(c => c.id === id ? { ...c, enlace_videollamada: data.enlace } : c);
            filtrarCitasAdmin();
            alert('Enlace enviado al cliente. Lo verá en su historial y en sus notificaciones.');
        } catch (e) {
            alert(e.message);
        }
    };

    window.abrirCostosCita = function (id) {
        __citaCostosId = id;
        document.getElementById('costos-cita-num').innerText = '#' + id;
        document.getElementById('form-costo-extra').reset();
        document.getElementById('modal-costos-cita').style.display = 'flex';
        pintarCostosCita();
    };

    document.getElementById('form-costo-extra').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch(`${API_BASE}/citas/${__citaCostosId}/costos-adicionales`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuario_id: __yo().id, concepto: document.getElementById('costo-concepto').value, monto: document.getElementById('costo-monto').value })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { alert(data.error || 'No se pudo agregar.'); return; }
        document.getElementById('form-costo-extra').reset();
        pintarCostosCita();
    });

    window.quitarCostoExtra = async function (id) {
        const res = await fetch(`${API_BASE}/citas/${__citaCostosId}/costos-adicionales/${id}?usuarioId=${__yo().id}`, { method: 'DELETE' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) alert(data.error || 'No se pudo quitar.');
        pintarCostosCita();
    };

    function pintarColaAuxiliar() {
        const caja = document.getElementById('cola-auxiliar');
        if (!caja || __yo().rol_id !== 4) return;
        const porReasignar = __citasTodas.filter(c => c.estado === 'Por reasignar').length;
        const solicitudes = __citasTodas.filter(c => !!c.cancelacion_solicitada).length;
        const tarjeta = (n, texto, valor) => `<button class="btn-outline" style="padding: 8px 14px; font-size: 13px;" onclick="document.getElementById('filtro-estado-citas').value='${valor}'; filtrarCitasAdmin();"><strong>${n}</strong> ${texto}</button>`;
        caja.innerHTML = tarjeta(porReasignar, 'por reasignar', 'Por reasignar') + tarjeta(solicitudes, 'solicitudes de cancelación', '__solicitud');
    }

    window.filtrarCitasAdmin = function () {
        pintarColaAuxiliar();
        const fecha = document.getElementById('filtro-fecha-citas').value;
        const estado = document.getElementById('filtro-estado-citas').value;

        let filtradas = __citasTodas;
        if (fecha) {
            filtradas = filtradas.filter(c => c.fecha_hora && c.fecha_hora.startsWith(fecha));
        }
        if (estado === '__solicitud') {
            filtradas = filtradas.filter(c => !!c.cancelacion_solicitada);
        } else if (estado) {
            filtradas = filtradas.filter(c => c.estado === estado);
        }
        pintarCitasAdmin(filtradas);
    };

    async function enviarCambioCita(url, metodo, cuerpo, mensajeError) {
        try {
            const res = await fetch(url, {
                method: metodo,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(cuerpo || {})
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) { alert(data.error || mensajeError); return null; }
            __citasTodas = __citasTodas.map(c => c.id === data.id ? data : c);
            filtrarCitasAdmin();
            return data;
        } catch (error) {
            console.error('Error actualizando cita:', error);
            alert(mensajeError);
            return null;
        }
    }

    window.cambiarEstadoCitaAdmin = async function (id, nuevoEstado) {
        const texto = nuevoEstado === 'Cancelada' ? '¿Cancelar esta cita? Se avisará al cliente.' : '¿Marcar que el cliente no asistió?';
        if (!confirm(texto)) return;
        await enviarCambioCita(`${API_BASE}/citas/${id}/estado`, 'PATCH', { estado: nuevoEstado }, 'No se pudo actualizar el estado de la cita.');
    };

    window.rechazarCita = async function (id) {
        const motivo = prompt('Motivo del rechazo (se le enviará al cliente):');
        if (motivo === null) return;
        await enviarCambioCita(`${API_BASE}/citas/${id}/estado`, 'PATCH', { estado: 'Rechazada', motivo: motivo.trim() }, 'No se pudo rechazar la cita.');
    };

    window.confirmarCitaVet = async function (id) {
        await enviarCambioCita(`${API_BASE}/citas/${id}/confirmar`, 'PATCH', {}, 'No se pudo confirmar la cita.');
    };

    window.noPuedoAtender = async function (id) {
        const motivo = prompt('¿Por qué no puedes atender esta cita? El Auxiliar la reasignará a otro veterinario.');
        if (motivo === null) return;
        const data = await enviarCambioCita(`${API_BASE}/citas/${id}/no-puedo-atender`, 'PATCH', { motivo: motivo.trim() }, 'No se pudo liberar la cita.');
        if (data) alert('Listo. La cita pasó a la cola "Por reasignar" del Auxiliar.');
    };

    window.resolverSolicitudCancelacion = async function (id, aprobar) {
        if (!confirm(aprobar ? '¿Aprobar la cancelación? Se avisará al cliente.' : '¿Mantener la cita? Se avisará al cliente que sigue vigente.')) return;
        await enviarCambioCita(`${API_BASE}/citas/${id}/solicitud-cancelacion/resolver`, 'PATCH', { aprobar }, 'No se pudo resolver la solicitud.');
    };

    let __citaReasignarId = null;
    window.abrirReasignar = async function (id) {
        __citaReasignarId = id;
        const c = __citasTodas.find(x => x.id === id);
        const m = c ? __mascotasTodas.find(x => x.id === c.mascota_id) : null;
        document.getElementById('reasignar-cita-num').innerText = '#' + id;
        document.getElementById('reasignar-cita-detalle').innerText = (m ? m.nombre + ' · ' : '') + (c && c.fecha_hora ? new Date(c.fecha_hora).toLocaleString('es-PE') : '') + (c && c.motivo_estado ? ' · Motivo: ' + c.motivo_estado : '');
        const select = document.getElementById('reasignar-vet');
        select.innerHTML = '<option value="">Cargando...</option>';
        document.getElementById('modal-reasignar-cita').style.display = 'flex';
        try {
            const res = await fetch(`${API_BASE}/citas/${id}/veterinarios-disponibles`);
            const vets = res.ok ? await res.json() : [];
            select.innerHTML = vets.map(v => `<option value="${v.id}">${__escC(v.nombre)}</option>`).join('');
            document.getElementById('reasignar-sin-vets').style.display = vets.length ? 'none' : 'block';
            document.getElementById('reasignar-confirmar').disabled = vets.length === 0;
        } catch (e) {
            select.innerHTML = '';
            document.getElementById('reasignar-sin-vets').style.display = 'block';
        }
    };

    window.confirmarReasignacion = async function () {
        const vet = document.getElementById('reasignar-vet').value;
        if (!vet) return;
        const data = await enviarCambioCita(`${API_BASE}/citas/${__citaReasignarId}/reasignar`, 'PATCH', { veterinario_id: Number(vet) }, 'No se pudo reasignar la cita.');
        if (data) {
            document.getElementById('modal-reasignar-cita').style.display = 'none';
            alert('Cita reasignada. Se avisó al cliente y al nuevo veterinario.');
        }
    };

    window.cancelarDesdeReasignar = async function () {
        if (!confirm('¿Cancelar la cita y avisar al cliente?')) return;
        const data = await enviarCambioCita(`${API_BASE}/citas/${__citaReasignarId}/estado`, 'PATCH', { estado: 'Cancelada', motivo: 'Sin veterinario disponible' }, 'No se pudo cancelar la cita.');
        if (data) document.getElementById('modal-reasignar-cita').style.display = 'none';
    };

    (async () => {
        try {
            const [resCitas, resMascotas, resUsuarios, resServicios] = await Promise.all([
                fetch(`${API_BASE}/citas`),
                fetch(`${API_BASE}/mascotas`),
                fetchUsuarios(),
                fetch(`${API_BASE}/servicios?incluirInactivos=true`)
            ]);

            __citasTodas = resCitas.ok ? await resCitas.json() : [];
            __mascotasTodas = resMascotas.ok ? await resMascotas.json() : [];
            __usuariosTodos = resUsuarios.ok ? await resUsuarios.json() : [];
            __serviciosTodos = resServicios.ok ? await resServicios.json() : [];

            __citasTodas.sort((a, b) => new Date(b.fecha_hora) - new Date(a.fecha_hora));
            pintarCitasAdmin(__citasTodas);
            pintarColaAuxiliar();
        } catch (error) {
            console.error('Error cargando citas:', error);
            document.getElementById('citas-admin-body').innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding: 20px;"><i class="fa-solid fa-plug-circle-xmark"></i> No pudimos conectar con el servidor.</td></tr>`;
        }
    })();
})();
</script>
