<div class="fade-in lab-hero" style="padding: 60px 20px;">
    <h1 style="font-size: 36px; font-weight: 800; margin-bottom: 10px;">Accesorios para tu Mascota</h1>
    <p style="color: #9CA3AF; font-size: 16px;">Correas, juguetes, camas y todo lo que necesita para estar cómodo y feliz.</p>
</div>

<div class="fade-in tienda-layout">

    <aside class="tienda-sidebar">
        <div class="filtro-seccion">
            <div class="filtro-titulo">Categorías</div>
            <div id="filtros-categoria-accesorios">
                <label class="filtro-label"><input type="checkbox" checked value="__todos" class="filtro-cat-accesorios" style="accent-color: var(--primary-green);"> Todos</label>
            </div>
        </div>

        <div class="filtro-seccion">
            <div class="filtro-titulo">Buscar</div>
            <input type="text" id="buscador-accesorios" placeholder="Nombre del producto..." style="width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #E4E7EC; font-family: 'Poppins'; font-size: 13px; outline: none;">
        </div>
    </aside>

    <div class="tienda-carousel-wrapper">
        <button class="carousel-arrow prev" onclick="desplazarCarrusel('grid-accesorios', -1)" aria-label="Anterior"><i class="fa-solid fa-chevron-left"></i></button>
        <div class="tienda-carousel-track" id="grid-accesorios">
            <p style="color: var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> Cargando productos...</p>
        </div>
        <button class="carousel-arrow next" onclick="desplazarCarrusel('grid-accesorios', 1)" aria-label="Siguiente"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
</div>

<script>
    (function () {
        let productosAccesorios = [];
        let categoriasAccesorios = [];
        let categoriaActiva = '__todos';

        function formatearPrecio(p) {
            return `S/ ${Number(p).toFixed(2)}`;
        }

        function nombreCategoria(categoriaId) {
            const c = categoriasAccesorios.find(x => x.id === categoriaId);
            return c ? c.nombre : 'Accesorios';
        }

        function imagenPorDefecto(categoriaId) {
            const nombre = nombreCategoria(categoriaId).toLowerCase();
            if (nombre.includes('cama')) return 'https://images.unsplash.com/photo-1596704122119-21b06f8c7eeb?q=80&w=300&auto=format&fit=crop';
            if (nombre.includes('correa') || nombre.includes('collar')) return 'https://images.unsplash.com/photo-1601322238423-f227546059e6?q=80&w=300&auto=format&fit=crop';
            if (nombre.includes('juguete')) return 'https://images.unsplash.com/photo-1576201836106-db1758fd1c97?q=80&w=300&auto=format&fit=crop';
            return 'https://images.unsplash.com/photo-1576201836106-db1758fd1c97?q=80&w=300&auto=format&fit=crop';
        }

        function renderProductos() {
            const grid = document.getElementById('grid-accesorios');
            const texto = (document.getElementById('buscador-accesorios').value || '').toLowerCase();

            const filtrados = productosAccesorios.filter(p => {
                const coincideCategoria = categoriaActiva === '__todos' || String(p.categoria_id) === String(categoriaActiva);
                const coincideTexto = !texto || (p.nombre || '').toLowerCase().includes(texto);
                return coincideCategoria && coincideTexto;
            });

            if (filtrados.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-muted); text-align:center; padding: 40px 0; width: 100%;">No encontramos productos con ese filtro.</p>`;
                return;
            }

            grid.innerHTML = filtrados.map(p => `
                <div class="shop-card">
                    <div class="shop-card-media" onclick="verProductoDetalle(${p.id})" style="cursor: pointer;">
                        <img src="${p.imagen || imagenPorDefecto(p.categoria_id)}" alt="${esc(p.nombre)}">
                    </div>
                    <div class="shop-card-body">
                        <div class="shop-card-cat">${nombreCategoria(p.categoria_id)}</div>
                        <div class="shop-card-name" onclick="verProductoDetalle(${p.id})" style="cursor: pointer;">${esc(p.nombre)}</div>
                        <div class="shop-card-price">${formatearPrecio(p.precio)}</div>
                        <button class="shop-card-btn" onclick='agregarProductoAccesorio(${p.id})' ${(p.stock || 0) <= 0 ? 'disabled' : ''}>
                            <i class="fa-solid fa-cart-plus"></i> ${(p.stock || 0) <= 0 ? 'Agotado' : 'Comprar Ahora'}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        window.agregarProductoAccesorio = function (id) {
            const p = productosAccesorios.find(x => x.id === id);
            if (!p) return;
            agregarAlCarrito({
                producto_id: p.id,
                nombre: p.nombre,
                categoria: nombreCategoria(p.categoria_id),
                precio: Number(p.precio),
                imagen: p.imagen || imagenPorDefecto(p.categoria_id)
            });
            alert(`"${p.nombre}" fue agregado al carrito.`);
        };

        async function cargarProductosAccesorios() {
            const grid = document.getElementById('grid-accesorios');
            try {
                const [resProductos, resCategorias] = await Promise.all([
                    fetch(`${API_BASE}/productos`),
                    fetch(`${API_BASE}/categorias?tipo=Accesorio`)
                ]);
                if (!resProductos.ok) throw new Error('No se pudo conectar');

                const todos = await resProductos.json();
                categoriasAccesorios = resCategorias.ok ? await resCategorias.json() : [];

                productosAccesorios = todos.filter(p => p.tipo === 'Accesorio' && p.estado !== 'Descontinuado');

                if (productosAccesorios.length === 0) {
                    grid.innerHTML = `<p style="color: var(--text-muted); text-align:center; padding: 40px 0; width: 100%;">Aún no hay accesorios registrados en el sistema.</p>`;
                    return;
                }

                const contenedorFiltros = document.getElementById('filtros-categoria-accesorios');
                contenedorFiltros.innerHTML = `<label class="filtro-label"><input type="checkbox" checked value="__todos" class="filtro-cat-accesorios" style="accent-color: var(--primary-green);"> Todos</label>` +
                    categoriasAccesorios.map(c => `<label class="filtro-label"><input type="checkbox" value="${c.id}" class="filtro-cat-accesorios" style="accent-color: var(--primary-green);"> ${esc(c.nombre)}</label>`).join('');

                document.querySelectorAll('.filtro-cat-accesorios').forEach(chk => {
                    chk.addEventListener('change', (e) => {
                        document.querySelectorAll('.filtro-cat-accesorios').forEach(c => c.checked = false);
                        e.target.checked = true;
                        categoriaActiva = e.target.value;
                        renderProductos();
                    });
                });

                renderProductos();
            } catch (error) {
                console.error('Error cargando accesorios:', error);
                grid.innerHTML = `<p style="color: var(--text-muted); text-align:center; padding: 40px 0; width: 100%;"><i class="fa-solid fa-plug-circle-xmark"></i> No pudimos conectar con el servidor. Verifica que Spring Boot esté corriendo.</p>`;
            }
        }

        document.getElementById('buscador-accesorios').addEventListener('input', renderProductos);
        cargarProductosAccesorios();
    })();
</script>
