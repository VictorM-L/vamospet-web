<div class="fade-in" style="padding-bottom: 40px;">
    <div class="login-container hover-card">
        
        <div class="login-image" style="background: url('https://images.unsplash.com/photo-1548199973-03cce0bbc87b?q=80&w=600&auto=format&fit=crop') center/cover;"></div>
        
        <div class="login-form-wrapper">
            <h2 style="font-size: 28px; font-weight: 800; margin-bottom: 10px;">Únete a la familia <i class="fa-solid fa-heart" style="color: var(--primary-green);"></i></h2>
            <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 30px; line-height: 1.5;">Crea una cuenta para agendar citas, ver historiales y comprar en nuestra tienda.</p>

            <form id="form-registro">
                <div class="input-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="registro-nombre" placeholder="Ej. Juan Pérez" required>
                </div>

                <div class="input-group">
                    <label>DNI</label>
                    <input type="text" id="registro-dni" placeholder="Ej. 12345678" maxlength="8" required>
                </div>

                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="registro-email" placeholder="ejemplo@correo.com" required>
                </div>
                
                <div style="display: flex; gap: 15px;">
                    <div class="input-group" style="flex: 1;">
                        <label>Contraseña</label>
                        <input type="password" id="registro-password" placeholder="Mínimo 8 caracteres" minlength="8" required>
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <label>Confirmar</label>
                        <input type="password" id="registro-confirm" placeholder="••••••••" required>
                    </div>
                </div>
                
                <div id="registro-paso-codigo" style="display: none; background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 12px; padding: 15px; margin-bottom: 20px;">
                    <p id="registro-codigo-msg" style="font-size: 13px; margin-bottom: 10px;"></p>
                    <div class="input-group" style="margin-bottom: 8px;">
                        <label>Código de 6 dígitos</label>
                        <input type="text" id="registro-codigo" maxlength="6" inputmode="numeric" placeholder="123456">
                    </div>
                    <p style="font-size: 12px; color: var(--text-muted);">¿No llegó? <a href="#" onclick="reenviarCodigoRegistro(); return false;" style="color: var(--primary-green); font-weight: 600;">Reenviar código</a> (máx. 1 por minuto)</p>
                </div>

                <div style="margin-bottom: 25px; font-size: 12px; color: var(--text-muted); line-height: 1.5;">
                    Al registrarte, aceptas nuestros <a href="#" style="color: var(--primary-green); font-weight: 600; text-decoration: none;">Términos de Servicio</a> y <a href="#" style="color: var(--primary-green); font-weight: 600; text-decoration: none;">Políticas de Privacidad</a>.
                </div>
                
                <button type="submit" id="registro-boton" class="btn-primary" style="width: 100%; justify-content: center; font-size: 16px;">Crear Cuenta</button>
            </form>
            
            <p style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted); font-weight: 500;">
                ¿Ya tienes una cuenta? <a href="#" onclick="cargarVista('login')" style="color: var(--primary-green); font-weight: 700; text-decoration: none;">Inicia sesión aquí</a>
            </p>
        </div>
    </div>
</div>
