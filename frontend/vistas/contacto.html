<div class="fade-in lab-hero">
    <span style="background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;">Estamos para ayudarte</span>
    <h1 style="font-size: 42px; font-weight: 800; margin: 15px 0;">Contáctanos</h1>
    <p style="color: #9CA3AF; font-size: 16px; max-width: 600px; margin: 0 auto;">Escríbenos, llámanos o visítanos. Nuestro equipo responde rápido, especialmente en emergencias.</p>
</div>

<div class="fade-in" style="max-width: 1200px; margin: 0 auto 80px auto; padding: 0 20px; display: flex; gap: 50px; flex-wrap: wrap;">

    <div style="flex: 1; min-width: 300px;">
        <h2 style="font-size: 28px; font-weight: 800; margin-bottom: 20px;">Nuestros canales</h2>

        <div class="contact-info-card">
            <div class="contact-info-icon"><i class="fa-solid fa-location-dot"></i></div>
            <div>
                <h4>Dirección</h4>
                <p data-clinica="direccion"></p>
            </div>
        </div>

        <div class="contact-info-card">
            <div class="contact-info-icon"><i class="fa-brands fa-whatsapp"></i></div>
            <div>
                <h4>Teléfono y WhatsApp</h4>
                <p><a data-clinica="telefono" data-clinica-href="tel" style="color: inherit;"></a> · <a data-clinica-href="whatsapp" target="_blank" rel="noopener" style="color: var(--primary-green); font-weight: 600;">Escríbenos por WhatsApp</a></p>
                <p data-clinica-si="emergencias_24h" style="font-size: 13px; color: var(--text-muted);">Emergencias las 24 horas</p>
            </div>
        </div>

        <div class="contact-info-card">
            <div class="contact-info-icon"><i class="fa-solid fa-envelope"></i></div>
            <div>
                <h4>Correo</h4>
                <p><a data-clinica="correo" data-clinica-href="correo" style="color: inherit;"></a></p>
            </div>
        </div>

        <div class="contact-info-card">
            <div class="contact-info-icon"><i class="fa-solid fa-clock"></i></div>
            <div>
                <h4>Horario de atención</h4>
                <p data-clinica="horario_atencion"></p>
            </div>
        </div>

        <div style="border-radius: 24px; overflow: hidden; margin-top: 30px; box-shadow: var(--shadow-soft);">
            <iframe
                data-clinica-mapa src="about:blank"
                width="100%" height="260" style="border:0; display:block;" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade" title="Ubicación Vamos Pet">
            </iframe>
        </div>
    </div>

    <div style="flex: 1; min-width: 300px;">
        <h2 style="font-size: 28px; font-weight: 800; margin-bottom: 20px;">Envíanos un mensaje</h2>
        <form id="form-contacto" class="contact-form">
            <div class="input-group">
                <label>Nombre completo</label>
                <input type="text" id="contacto-nombre" placeholder="Tu nombre" maxlength="100" required>
                <small class="mensaje-campo" data-mensaje-para="contacto-nombre"></small>
            </div>
            <div class="input-group">
                <label>Correo electrónico</label>
                <input type="email" id="contacto-email" placeholder="tucorreo@ejemplo.com" maxlength="150" required>
                <small class="mensaje-campo" data-mensaje-para="contacto-email"></small>
            </div>
            <div class="input-group">
                <label>Teléfono</label>
                <input type="tel" id="contacto-telefono" placeholder="9 dígitos (opcional)" maxlength="9" inputmode="numeric">
                <small class="mensaje-campo" data-mensaje-para="contacto-telefono"></small>
            </div>
            <div class="input-group">
                <label>Motivo</label>
                <select id="contacto-motivo" required>
                    <option value="">Selecciona una opción</option>
                    <option value="Agendar una cita">Agendar una cita</option>
                    <option value="Emergencia">Emergencia</option>
                    <option value="Consulta sobre farmacia">Consulta sobre farmacia</option>
                    <option value="Otro">Otro</option>
                </select>
                <small class="mensaje-campo" data-mensaje-para="contacto-motivo"></small>
            </div>
            <div class="input-group">
                <label>Mensaje</label>
                <textarea id="contacto-mensaje" rows="5" placeholder="Cuéntanos en qué podemos ayudarte" minlength="10" maxlength="2000" required></textarea>
                <small class="mensaje-campo" data-mensaje-para="contacto-mensaje"></small>
            </div>
            <div class="campo-trampa" aria-hidden="true">
                <label for="contacto-sitio">Sitio web</label>
                <input type="text" id="contacto-sitio" tabindex="-1" autocomplete="off">
            </div>
            <p id="contacto-confirmacion" class="contacto-confirmacion" role="status" hidden></p>
            <button type="submit" class="btn-primary" style="width: 100%; padding: 15px;"><i class="fa-solid fa-paper-plane"></i> Enviar Mensaje</button>
        </form>
    </div>
</div>
