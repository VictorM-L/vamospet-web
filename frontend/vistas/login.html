<div class="fade-in" style="padding-bottom: 40px;">
    <div class="login-container hover-card">
        
        <div class="login-image"></div>
        
        <div class="login-form-wrapper">
            <h2 style="font-size: 28px; font-weight: 800; margin-bottom: 10px;">¡Hola de nuevo! <i class="fa-solid fa-paw" style="color: var(--primary-green);"></i></h2>
            <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 35px; line-height: 1.5;">Ingresa tus credenciales para acceder a tu panel de control y ver el historial de tu mascota.</p>

            <form id="form-login">
                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="login-email" placeholder="ejemplo@correo.com" required>
                </div>
                
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; font-size: 13px;">
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: 500; color: var(--text-muted);">
                        <input type="checkbox" style="accent-color: var(--primary-green); width: 16px; height: 16px;"> Recordarme
                    </label>
                    <a href="#" style="color: var(--primary-green); font-weight: 600; text-decoration: none;">¿Olvidaste tu contraseña?</a>
                </div>
                
                <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; font-size: 16px;">Iniciar Sesión</button>
            </form>
            
            <p style="text-align: center; margin-top: 25px; font-size: 14px; color: var(--text-muted); font-weight: 500;">
                ¿No tienes una cuenta? <a href="#" onclick="cargarVista('registro')" style="color: var(--primary-green); font-weight: 700; text-decoration: none;">Regístrate aquí</a>
            </p>
        </div>
    </div>
</div>
