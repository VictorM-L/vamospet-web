<div class="fade-in lab-hero" style="padding: 50px 20px; margin-bottom: 30px;">
    <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 10px;">Tu Carrito de Compras</h1>
    <p style="color: #9CA3AF; font-size: 16px;">Revisa tus productos antes de finalizar la compra.</p>
</div>

<div class="fade-in carrito-layout" id="carrito-layout">
</div>

<script>
    (function () {
        function formatearPrecio(p) {
            return `S/ ${Number(p).toFixed(2)}`;
        }

        function calcularTotales(carrito) {
            const total = carrito.reduce((sum, p) => sum + (p.precio * p.cantidad), 0);
            return { total };
        }

        function renderCarrito() {
            const carrito = obtenerCarrito();
            const layout = document.getElementById('carrito-layout');

            if (carrito.length === 0) {
                layout.innerHTML = `
                    <div style="max-width: 500px; margin: 60px auto; text-align: center;">
                        <i class="fa-solid fa-cart-shopping" style="font-size: 60px; color: #E4E7EC; margin-bottom: 20px;"></i>
                        <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 10px; color: var(--dark-text);">Tu carrito está vacío</h3>
                        <p style="color: var(--text-muted); margin-bottom: 25px;">Explora nuestra farmacia o tienda de accesorios y encuentra lo mejor para tu mascota.</p>
                        <button class="btn-primary" onclick="cargarVista('farmacia')">Ir a la Farmacia</button>
                    </div>
                `;
                return;
            }

            const { total } = calcularTotales(carrito);

            const itemsHtml = carrito.map((p, index) => `
                <div class="cart-item">
                    <img src="${p.imagen}" class="cart-img" alt="${esc(p.nombre)}">
                    <div class="cart-details">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div>
                                <span style="font-size: 11px; color: var(--primary-green); font-weight: 700; text-transform: uppercase;">${esc(p.categoria)}</span>
                                <h3 style="font-size: 16px; font-weight: 700; color: var(--dark-text); margin: 5px 0;">${esc(p.nombre)}</h3>
                            </div>
                            <button style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px;" class="hover-card" onclick="quitarDelCarrito(${index})"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px;">
                            <div class="cart-qty-controls">
                                <button class="cart-qty-btn" onclick="cambiarCantidad(${index}, -1)"><i class="fa-solid fa-minus"></i></button>
                                <span style="font-weight: 700; font-size: 15px;">${p.cantidad}</span>
                                <button class="cart-qty-btn" onclick="cambiarCantidad(${index}, 1)"><i class="fa-solid fa-plus"></i></button>
                            </div>
                            <div style="font-size: 18px; font-weight: 800; color: var(--dark-text);">${formatearPrecio(p.precio * p.cantidad)}</div>
                        </div>
                    </div>
                </div>
            `).join('');

            layout.innerHTML = `
                <div class="carrito-items">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                        <h2 style="font-size: 20px; font-weight: 800;"><i class="fa-solid fa-basket-shopping" style="color: var(--primary-green); margin-right: 8px;"></i> ${carrito.length} Producto${carrito.length !== 1 ? 's' : ''}</h2>
                        <button style="background: none; border: none; color: #EF4444; cursor: pointer; font-size: 14px; font-weight: 600;" onclick="vaciarCarrito()"><i class="fa-regular fa-trash-can"></i> Vaciar carrito</button>
                    </div>
                    ${itemsHtml}
                </div>

                <div class="carrito-resumen">
                    <h3 style="font-size: 20px; font-weight: 800; margin-bottom: 25px;">Resumen del Pedido</h3>

                    <div class="resumen-row">
                        <span>Subtotal (${carrito.length} producto${carrito.length !== 1 ? 's' : ''})</span>
                        <span style="font-weight: 600; color: var(--dark-text);">${formatearPrecio(total)}</span>
                    </div>
                    <div style="background: var(--light-green); border-radius: 10px; padding: 10px 14px; font-size: 12px; color: var(--primary-green); margin: 10px 0;">
                        <i class="fa-solid fa-store"></i> Recojo en Tienda — sin costo de envío
                    </div>

                    <div class="resumen-total">
                        <span>Total a Pagar</span>
                        <span style="color: var(--primary-green);">${formatearPrecio(total)}</span>
                    </div>

                    <button class="btn-primary" style="width: 100%; margin-top: 25px; justify-content: center; font-size: 16px; padding: 15px;" onclick="procesarCheckout()">
                        <i class="fa-solid fa-lock" style="margin-right: 8px;"></i> Proceder al Pago
                    </button>

                    <div style="text-align: center; margin-top: 15px; font-size: 12px; color: var(--text-muted);">
                        <i class="fa-solid fa-shield-halved"></i> Pago 100% seguro y cifrado.
                    </div>
                </div>
            `;
        }

        window.cambiarCantidad = function (index, delta) {
            const carrito = obtenerCarrito();
            carrito[index].cantidad += delta;
            if (carrito[index].cantidad <= 0) carrito.splice(index, 1);
            guardarCarrito(carrito);
            renderCarrito();
        };

        window.quitarDelCarrito = function (index) {
            const carrito = obtenerCarrito();
            carrito.splice(index, 1);
            guardarCarrito(carrito);
            renderCarrito();
        };

        window.vaciarCarrito = function () {
            guardarCarrito([]);
            renderCarrito();
        };

        window.procesarCheckout = function () {
            const usuarioJSON = localStorage.getItem('usuarioLogueado');
            if (!usuarioJSON) {
                alert('Debes iniciar sesión para finalizar tu compra.');
                cargarVista('login');
                return;
            }
            if (obtenerCarrito().length === 0) return;
            cargarVista('VistaCliente/checkout');
        };

        renderCarrito();
    })();
</script>
